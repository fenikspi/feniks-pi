# Feniks π, javna stranica: statične datoteke iz ./public na feniksPi.com i www.feniksPi.com
name = "feniks-pi"
compatibility_date = "2026-10-01"
main = "src/worker.js"
workers_dev = false
routes = [
  { pattern = "feniksPi.com", custom_domain = true },
  { pattern = "www.feniksPi.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# anonimni simbolički obrasci (doprinos uz pristanak, bez osobnih podataka)
[[d1_databases]]
binding = "OBRASCI"
database_name = "feniks-obrasci"
database_id = "7587bd83-2ce5-406b-86e0-2edb6487c8e9"

# računi: zasebna baza, odvojena od anonimnih obrazaca (šifrirani podaci, imena samo kao HMAC)
[[d1_databases]]
binding = "RACUNI"
database_name = "feniks-racuni"
database_id = "3d3144fb-8896-44f9-84ec-4e554fdf440a"

[observability]
enabled = false

# svakodnevno čišćenje računa i prijava (Pravila privatnosti, odjeljak 8)
[triggers]
crons = ["17 3 * * *"]
